name: Actualizar libros de Goodreads

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # lunes por la mañana

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: goodreads-${{ github.run_id }}
          restore-keys: goodreads-
      - run: python3 scripts/build_data.py --refresh
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library.json
          git diff --cached --quiet || git commit -m "Actualiza datos de Goodreads" && git push
